<h1>Aanbod — bruiloft laten organiseren in Twente</h1>
<p>Drie manieren om samen te werken, elk met dezelfde belofte: rust op jullie trouwdag.</p>
<h2>Goud — volledige organisatie</h2>
<p>Ik begeleid jullie van het eerste idee tot de laatste dans: concept en stijl, leveranciers, planning, budget, draaiboek en dagcoördinatie. Advies: begin minimaal twaalf maanden van tevoren.</p>
<h2>Zilver — ceremoniemeester en dagcoördinatie</h2>
<p>Jullie plannen zelf, ik neem de trouwdag over. Draaiboek, tijdschema, aansturing van leveranciers en een vast aanspreekpunt voor iedereen, zodat jullie gasten kunnen zijn op jullie eigen bruiloft.</p>
<h2>Brons — trouwambtenaar</h2>
<p>Een persoonlijke ceremonie, geschreven en geleid door een eigen trouwambtenaar (BABS).</p>
<h2>Veelgestelde vragen</h2>
<p>Werkgebied: voornamelijk Overijssel, met een sterke focus op Enschede, Hengelo, Almelo, Oldenzaal en omstreken. Ik neem maximaal vijf bruiloften per jaar aan.</p>
<p><a href="contact.html">Plan een vrijblijvende kennismaking</a></p>
