<h1>Weddingplanner in Twente — Eens &amp; Altijd</h1>
<p>Eens &amp; Altijd is de weddingplanner van Elise: persoonlijke begeleiding bij het plannen en organiseren van jullie bruiloft in Enschede, Hengelo, Almelo, Oldenzaal en de rest van Twente en Overijssel.</p>
<p>Van het eerste idee tot de laatste dans neem ik de organisatie, de leveranciers, de planning en het draaiboek uit handen, zodat jullie zorgeloos kunnen stralen in jullie eigen sprookje. Maximaal vijf bruiloften per jaar, zodat elk liefdesverhaal volledige aandacht krijgt.</p>
<h2>Drie manieren om samen te werken</h2>
<ul>
<li><strong>Goud</strong> — volledige organisatie van de bruiloft, van concept tot dagcoördinatie.</li>
<li><strong>Zilver</strong> — ceremoniemeester en dagcoördinatie op de trouwdag zelf.</li>
<li><strong>Brons</strong> — trouwambtenaar voor een persoonlijke ceremonie.</li>
</ul>
<p><a href="aanbod.html">Bekijk het aanbod</a> · <a href="over.html">Over Elise</a> · <a href="contact.html">Plan een kennismaking</a></p>

    const HERO_SCRIMS = {

      avond:   'linear-gradient(180deg, rgba(43,33,23,0.30) 0%, rgba(43,33,23,0.50) 60%, rgba(43,33,23,0.70) 100%)',

    const CANVASES = {

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

        --hero-scrim:${HERO_SCRIMS[t.heroMood] || HERO_SCRIMS.avond};
      }`;
      return (
        <>
          <style>{css}</style>
          <SiteNav active="home" />

          <HomeCalm />

          <WhatsAppFloat />

                        onChange={(v) => setTweak('accent', v)} />
            <TweakRadio label="Licht in de hero" value={t.heroMood}
                        options={['ochtend', 'avond', 'kaarslicht']}
                        onChange={(v) => setTweak('heroMood', v)} />
            <TweakRadio label="Canvas" value={t.canvas}
