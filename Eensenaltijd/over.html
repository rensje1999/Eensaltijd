<h1>Over Elise — de weddingplanner achter Eens &amp; Altijd</h1>
<p>Ik ben Elise, weddingplanner, ceremoniemeester en trouwambtenaar, gevestigd in Enschede en werkzaam door heel Twente en Overijssel.</p>
<p>Waar organisatie en magie samenkomen: ik luister eerst en plan daarna. Geen kant-en-klaar pakket dat ik over jullie heen leg, maar een dag die aanvoelt als jullie eigen verhaal.</p>
<h2>Waar ik voor sta</h2>
<p>Persoonlijke aandacht, volledige rust op de dag zelf, eerlijk advies over budget en leveranciers, en maximaal vijf bruiloften per jaar zodat er altijd ruimte is voor het onverwachte.</p>
<p><a href="aanbod.html">Bekijk het aanbod</a> · <a href="contact.html">Neem contact op</a></p>
